<html lang="en">
<head>
   <title>Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: grey;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            width: 350px;
        }

        h2 {
            text-align: center;
            color: red;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border-radius: 5px;
                    }

        button {
            width: 100%;
            padding: 10px;
            background-color:green;
            color: white;
            
            border-radius: 5px;
            font-size: 16px;
                    }

        button:hover {
            background-color: grey;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: green;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Registration Form</h2>

    <form id="empregistrationForm">
    <label for="emp_name">employee name</label>
    <input type="text" id="employee name" required>
    <br>
    <label for="emp_id">employee id</label>
    <input type="number" id="employee id" required>
    <br>
       <label for="phnumber">Phone Number</label>
    <input type="tel" id="phone" pattern="[0-9]{10}" placeholder="10-digit phone number" required>
    <br>
    <label for="gmail">Gmail</label>
    <input type="email" id="gmail" placeholder="example@gmail.com" required>
    <label for="salary">salary</label>
    <input type="text" id="salary" placeholder="1,00,000/-" required>
     <label for="doj">date of join</label>
    <input type="date" id="date of join" placeholder="01/01/2026" required>
     <label for="location">location</label>
    <input type="text" id="location" placeholder="hyd" required>

    <button type="submit">Submit</button>
    </form>
  <div id="message">Submitted!</div>
</div>
<script>
    document.getElementById("empregistrationForm").addEventListener("submit", function(event) {
        event.preventDefault();        
        document.getElementById("message").style.display = "block";
    });
</script>
</body>
</html>
